# ONE paid model request, only after explicit operator approval. Prepared for review; NOT dispatched.
# Preconditions (none verified yet): a GitHub Environment `live-model` with the operator as required reviewer exists
# and works for this private repository; the secret ANTHROPIC_API_KEY is stored in that environment; the approval
# packet in the repository records the operator's approval and binds this file's sha256 and the code commit.
# The job never executes the model's response: it does not pass --execute, and the runner refuses live output anyway.
name: live-proposal

on:
  workflow_dispatch:
    inputs:
      approval_packet:
        description: Path of the committed, operator-approved approval packet
        required: true
        default: demo/live/approval.json

permissions:
  contents: read

jobs:
  live-proposal:
    runs-on: ubuntu-24.04
    environment: live-model
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Build the synthetic demo repository at the path the request names
        run: .venv/bin/python -m ira build-demo --dest /tmp/ira-demo-repo
      - name: One live model request (approval verified before any network call; response never executed)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APPROVAL_PACKET: ${{ inputs.approval_packet }}
        run: .venv/bin/python -m ira run --live --request demo/live/request.json --approval-packet "$APPROVAL_PACKET" --out out/live
      - name: Assert no containers were created
        if: ${{ always() }}
        run: |
          if command -v docker >/dev/null && [ -n "$(docker ps -a -q --filter label=ira.run)" ]; then exit 1; fi
          echo "no ira containers"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ always() }}
        with:
          name: live-proposal-packet
          path: out/live/
          if-no-files-found: warn
